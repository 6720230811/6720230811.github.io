name: Deploy to GitHub Pages

on:
  # 推送到 main 分支时自动部署
  push:
    branches: [main]
  # 每天定时重建 —— 为的是拾遗（/gleanings/）那份 star 快照：
  # 构建前会重新抓一次（见 build 里的 collect 那一步），所以页面上的数据是新的。
  # UTC 20:17 = 北京时间 04:17，挑的是没人看站的时候。
  schedule:
    - cron: '17 20 * * *'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 避免并发部署互相覆盖
concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 把抓取那一步的结果透给 deploy —— 只有 deploy 结束后才有资格把整次 run 判红
    # （理由见 deploy 里最后那一步）
    outputs:
      collect: ${{ steps.collect.outcome }}
      radar: ${{ steps.radar.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 拾遗页的数据快照：**在构建之前**抓一次，写进 src/data/gleanings/stars.json。
      # 只喂本次构建，**不提交回仓库** —— 所以不需要 contents: write，
      # 也不会污染 git log。
      #
      # `continue-on-error` 是刻意的：抓取失败（限流、源改版）**不该掐断一次正常的部署**。
      # 仓库里的 stars.json 就是上一次的快照，照旧构建，页面顶多旧一天 ——
      # 而若让它失败到底，一次 API 抖动就会把「推送文章本该触发的部署」一起挡掉，那更糟。
      # 注意 `collect.mjs` 自己的四道守卫保证它**不会写坏数据**：
      # 任何一道命中就整份不写，宁可用旧的。
      - name: Refresh gleanings snapshot
        id: collect
        continue-on-error: true
        run: node scripts/collect.mjs

      # 雷达的九个榜单。**九个源互相独立**：每个源各跑一遍自己的五道守卫，
      # 谁挂了就沿用谁的上一次快照，其余照常更新 —— 所以这一整步的退出码
      # 只在「一个都没取到」时为 0，只要有源失败了就是非 0。
      #
      # 这和上面 collect.mjs 的语义不一样（那份是「整份要么全写、要么不写」），
      # 所以这里**同样**用 continue-on-error：**中文热榜的失败形态是常态**
      # （改版、限流、加签名），一次抖动不该让整站部署失败。
      # 九个源里的每一个都已经在页面上标了「暂时取不到」，坏是看得见的 —— 不需要靠判红。
      - name: Refresh radar snapshot
        id: radar
        continue-on-error: true
        run: node scripts/collect-radar.mjs

      - name: Install, build, and upload
        uses: withastro/action@v6
        # with:
        #   node-version: 24        # 默认 24（需 >= 22.12）
        #   package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 抓取失败要**被看见**，但又不能拦住部署 —— 所以把它放到部署**之后**再判红。
      #
      # 放在 build 里判红是不行的：那会让 deploy 因为 needs 失败而整个跳过，
      # 推送一篇文章都可能被一次 API 抖动挡在门外。
      # 放在这里，语义正好是想要的：**红得看得见，站照常上**。
      - name: Surface a failed snapshot refresh
        if: needs.build.outputs.collect == 'failure' || needs.build.outputs.radar == 'failure'
        run: |
          if [ "${{ needs.build.outputs.collect }}" = "failure" ]; then
            echo "::error::拾遗 star 快照抓取失败 —— 这次部署用的是仓库里上一次的快照，页面上的数据可能旧了一天。"
          fi
          if [ "${{ needs.build.outputs.radar }}" = "failure" ]; then
            echo "::error::雷达抓取有源失败（九个源里有至少一个没取到）—— 失败的那一格在页面上标了「暂时取不到」，沿用它的上一次快照。"
          fi
          echo "抓取脚本的报错在上一步（build / Refresh … snapshot）的日志里。"
          exit 1
