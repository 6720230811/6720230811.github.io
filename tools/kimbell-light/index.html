<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>金贝尔单摆线拱 · 采光验证</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }

      /* HUD 是页面 UI，不在 3D 场景里 —— 场景内不放任何招牌/文字 */
      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        width: min(360px, calc(100vw - 32px));
        padding: 14px 16px 16px;
        border-radius: 12px;
        background: rgba(16, 18, 22, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(8px);
        color: #e8e8e6;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
        user-select: none;
      }
      #hud h1 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.04em; opacity: 0.72; font-weight: 600; }
      .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .clock { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .state { font-size: 12px; opacity: 0.66; text-align: right; }
      input[type='range'] { width: 100%; margin: 10px 0 12px; accent-color: #d8b26a; }
      #stats {
        margin: 0;
        font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        opacity: 0.7;
        white-space: pre;
      }
      #hint { margin-top: 10px; font-size: 11.5px; opacity: 0.45; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">
      <h1>金贝尔美术馆 · 单摆线拱采光验证</h1>
      <div class="row">
        <span class="clock" id="clock">12:00</span>
        <span class="state" id="sun-state"></span>
      </div>
      <input id="time" type="range" min="6" max="19" step="0.25" value="12" aria-label="时间" />
      <pre id="stats"></pre>
      <div id="hint">拖动鼠标转视角，滚轮拉近推远</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
