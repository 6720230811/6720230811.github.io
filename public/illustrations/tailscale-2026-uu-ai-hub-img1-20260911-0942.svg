<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="350" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1"/>

  <!-- Laptop -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="10" y="8" width="140" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="45" text-anchor="middle" font-size="14" fill="#22d3ee" font-family="system-ui" font-weight="600">MacBook Pro</text>
    <text x="80" y="65" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">Tailscale IP: 100.76.1.2</text>
    <rect x="45" y="105" width="70" height="5" rx="2" fill="#475569"/>
    <text x="80" y="135" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="system-ui">咖啡厅 WiFi</text>
  </g>

  <!-- NAS / Server -->
  <g transform="translate(560, 80)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="50" height="20" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="40" width="50" height="20" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="40" cy="80" r="5" fill="#22d3ee"/>
    <text x="80" y="100" text-anchor="middle" font-size="14" fill="#22d3ee" font-family="system-ui" font-weight="600">NAS / 服务器</text>
    <text x="80" y="118" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">Tailscale IP: 100.64.5.10</text>
    <text x="80" y="150" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="system-ui">家庭网络</text>
  </g>

  <!-- WireGuard encrypted tunnel -->
  <line x1="240" y1="150" x2="560" y2="140" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8,4" opacity="0.8"/>
  <text x="400" y="130" text-anchor="middle" font-size="13" fill="#22d3ee" font-family="system-ui" font-weight="600">
    🔒 WireGuard 端到端加密隧道
  </text>
  <text x="400" y="170" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">
    延迟 ~5ms · 直连 (p2p)
  </text>

  <!-- DERP fallback -->
  <g transform="translate(350, 210)">
    <rect x="0" y="0" width="100" height="50" rx="25" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="50" y="22" text-anchor="middle" font-size="11" fill="#818cf8" font-family="system-ui">DERP 中继</text>
    <text x="50" y="38" text-anchor="middle" font-size="10" fill="#64748b" font-family="system-ui">备用路径</text>
  </g>
  <line x1="320" y1="155" x2="355" y2="215" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="560" y1="145" x2="450" y2="215" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Coordination server -->
  <g transform="translate(360, 285)">
    <circle cx="40" cy="0" r="22" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="40" y="5" text-anchor="middle" font-size="10" fill="#64748b" font-family="system-ui">☁️ 协调</text>
    <text x="40" y="40" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="system-ui">Tailscale 云端</text>
    <text x="40" y="55" text-anchor="middle" font-size="10" fill="#475569" font-family="system-ui">仅控制信息</text>
  </g>
  <line x1="280" y1="140" x2="362" y2="288" stroke="#475569" stroke-width="1" stroke-dasharray="2,4" opacity="0.3"/>
  <line x1="560" y1="130" x2="438" y2="288" stroke="#475569" stroke-width="1" stroke-dasharray="2,4" opacity="0.3"/>

  <!-- Legend -->
  <g transform="translate(20, 310)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="38" y="4" font-size="10" fill="#64748b" font-family="system-ui">WireGuard 直连</text>
    <line x1="150" y1="0" x2="180" y2="0" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="188" y="4" font-size="10" fill="#64748b" font-family="system-ui">DERP 中继（备用）</text>
  </g>
</svg>
